default:
  image: python:3.11-slim

stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python -m pip install --upgrade pip
  - if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

linting:
  stage: lint
  script:
    - pip install ruff
    - ruff check .

unit_tests:
  stage: test
  script:
    - pip install pytest pytest-cov
    - pytest --cov=.